{{define "header"}}
<header class="site-header">
  <a class="logo" href="{{url "/"}}">Mon Blog</a>
  <nav>
    <a href="{{url "/"}}">Articles</a>
    {{if .AllTags}}
    {{range .AllTags}}
    <a class="tag-link{{if eq $.CurrentTag .}} is-active{{end}}" href="{{url (printf "/tags/%s/" (slug .))}}">{{.}}</a>
    {{end}}
    {{end}}
  </nav>
</header>
{{end}}

{{define "footer"}}
<footer class="site-footer">
  <p>Généré le {{.GeneratedAt.Format "02/01/2006 à 15:04"}}</p>
</footer>
{{end}}
