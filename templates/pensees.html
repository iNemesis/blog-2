{{define "pensees.html"}}
<!doctype html>
<html lang="fr">
  <head>
    {{template "head" .}}
  </head>
  <body>
    <div class="wrap">
      {{template "header" .}}

      <main>
        <section class="hero">
          <h1>Fil de pensées</h1>
        </section>

        {{if not .Pensees}}
        <p class="empty">Aucune pensée pour le moment.</p>
        {{else}}
        <ul class="pensee-list">
          {{range .Pensees}}
          <li class="pensee">
            <div class="post-meta">
              <time datetime="{{.Date.Format `2006-01-02T15:04`}}"
                >{{fmtDate .Date}} à {{.Date.Format `15:04`}}</time
              >
            </div>
            <div class="prose">{{.HTML}}</div>
          </li>
          {{end}}
        </ul>
        {{end}}
      </main>

      {{template "footer" .}}
    </div>
  </body>
</html>
{{end}}
